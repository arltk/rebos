[managers.system]
items = [
  # Core Utilities
  #"kde-misc/krusader", # File Explorer (might switch, check out pcmanfm)
  "app-office/libreoffice", # Office suite
  "gui-apps/wl-clipboard", # Clipboard manager
  "mail-client/thunderbird", # Thunderbird mail client
  "media-gfx/feh", # Image viewer
  "media-gfx/nomacs", # Image viewer with more features than feh
  "media-video/vlc", # VLC media player
  "x11-misc/pcmanfm", # File manager
	"x11-terms/kitty", # Terminal emulator

  # Extended Utilities
  "kde-apps/kdenlive", # Video editor
  "media-gfx/gimp", # GNU Image Manipulation Program
  "media-video/obs-studio", # Recording & streaming client
  "net-im/discord", # Discord client
  "net-im/signal-desktop-bin", # Signal messaging client
  
  # Games
  "games-action/prismlauncher", # Minecraft launcher, fork of MultiMC
  "games-util/heroic-bin", # Heroic games launcher (Epic Games open-source launcher)
  "games-util/lutris", # Open source gaming platform for GNU/Linux
  "games-util/steam-launcher", # Steam launcher

  # Miscellaneous applications
  #"kde-apps/kdenlive", # Lightweight video editing application
  "net-analyzer/wireshark", # Utility for analzying network traffic
  "net-misc/remmina", # RDP & remote-access client
  "net-p2p/qbittorrent", # Torrenting client, written in C++ and Qt
]

[managers.flatpak]
items = [
  "com.brave.Browser", # Chromium-based web browser
  "com.protonvpn.www", # ProtonVPN client
  "one.ablaze.floorp", # Firefox-based web browser
  "me.proton.Mail", # ProtonMail client, might want to forego this in favor of using the web browser
]

[managers.flatpak_system]
items = [
  "com.dec05eba.gpu_screen_recorder", # NVIDIA Shadowplay clone
]

